openapi: 3.0.3
info:
  title: TelcoCore MVNO · API de rating y facturación
  version: 1.0.0
  description: |
    Motor de rating y facturación para un operador móvil virtual (MVNO).

    **Flujo típico:** (1) se sube un lote de CDR en CSV o JSON; (2) cada registro se valida y se tarifica con la
    estrategia del plan del suscriptor; (3) los registros inválidos quedan en cuarentena con su causa;
    (4) se consulta la factura mensual.

    **Reglas importantes**
    - Un lote se procesa en **una sola transacción**: o se guarda completo o no se guarda nada.
    - El mismo archivo (mismo contenido) no se procesa dos veces: responde `409`.
    - Si más del 50 % de las filas son inválidas, el lote completo se rechaza (`422`).
    - Los montos están en pesos colombianos (COP), sin IVA, y viajan como **texto** para no perder precisión.
    - Los períodos de facturación son meses calendario en hora de Bogotá (`YYYY-MM`).
servers:
  - url: http://localhost:3000/api
    description: Servidor local de desarrollo
tags:
  - name: Lotes
    description: Carga de CDR y cuarentena
  - name: Facturas
  - name: Planes
  - name: Suscriptores
  - name: Sistema

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Comprueba que la API está viva
      responses:
        '200':
          description: La API responde
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }

  /lotes/cdr:
    post:
      tags: [Lotes]
      summary: Sube y procesa un lote de CDR
      description: |
        Acepta un archivo **CSV** (encabezado obligatorio; separador coma o punto y coma) o **JSON** (arreglo de
        objetos). Máximo 10 MB y 10.000 registros. Las filas inválidas no detienen el lote: van a cuarentena.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
                  description: Archivo `.csv` o `.json`
      responses:
        '201':
          description: Lote procesado (puede incluir filas rechazadas)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoIngesta' }
              example: { loteId: 1, estado: PROCESADO_CON_RECHAZOS, total: 14, aceptados: 8, rechazados: 6 }
        '400':
          description: Falta el archivo (`ARCHIVO_FALTANTE`) o el formato no es CSV ni JSON (`FORMATO_NO_SOPORTADO`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Ese archivo ya fue procesado (`LOTE_DUPLICADO`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413':
          description: El archivo supera los 10 MB (`ARCHIVO_DEMASIADO_GRANDE`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: El archivo es ilegible o más del 50 % de sus filas son inválidas (`LOTE_CORRUPTO`); no se guardó nada
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /lotes:
    get:
      tags: [Lotes]
      summary: Historial de los 50 lotes más recientes
      responses:
        '200':
          description: Lotes, del más reciente al más antiguo
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Lote' } }

  /rechazos:
    get:
      tags: [Lotes]
      summary: Cuarentena de un lote (filas rechazadas)
      parameters:
        - { name: lote, in: query, required: true, schema: { type: integer, minimum: 1 }, description: Identificador del lote }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 }, description: Página (empieza en 1) }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 }, description: Filas por página }
      responses:
        '200':
          description: Página de rechazos ordenada por número de fila
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaRechazos' }
        '400':
          description: Parámetros inválidos (`SOLICITUD_INVALIDA`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: El lote no existe (`LOTE_NO_ENCONTRADO`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /facturas:
    get:
      tags: [Facturas]
      summary: Factura mensual de un suscriptor
      description: |
        Factura = cuota fija del plan (una sola vez) + suma de las líneas tarificadas del período.
        Es idempotente: consultarla varias veces no crea facturas duplicadas.
      parameters:
        - { name: suscriptor, in: query, required: true, schema: { type: string, pattern: '^\d{10}$' }, description: Número de línea (10 dígitos), example: '3002000002' }
        - { name: mes, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, description: Período `YYYY-MM`, example: '2026-10' }
      responses:
        '200':
          description: Factura del período
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Factura' }
              example:
                suscriptor: '3002000002'
                periodo: '2026-10'
                plan: Postpago-Mix
                cuotaFija: '59900'
                totalVariable: '1200'
                total: '61100'
                lineas:
                  - { concepto: Voz incluida, cantidad: '18000', unidad: SEG, monto: '0' }
                  - { concepto: Voz excedente, cantidad: '200', unidad: SEG, monto: '300' }
                  - { concepto: SMS incluida, cantidad: '100', unidad: SMS, monto: '0' }
                  - { concepto: SMS excedente, cantidad: '20', unidad: SMS, monto: '900' }
        '400':
          description: Parámetros inválidos o período futuro (`SOLICITUD_INVALIDA`, `PERIODO_INVALIDO`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: El suscriptor no existe (`SUSCRIPTOR_NO_EXISTE`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /planes:
    get:
      tags: [Planes]
      summary: Catálogo de planes
      responses:
        '200':
          description: Planes registrados
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Plan' } }
    post:
      tags: [Planes]
      summary: Crea un plan nuevo solo con datos (sin programar)
      description: |
        El `tipoEstrategia` debe estar registrado (`PREPAGO_CLASICO`, `POSTPAGO_MIX`, `DATOS_FLEX` o cualquier
        estrategia agregada como archivo `*.strategy.ts`). Los `parametros` se validan con el esquema de esa
        estrategia **antes** de guardar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoPlan' }
            example:
              nombre: Postpago-Mini
              tipoEstrategia: POSTPAGO_MIX
              parametros:
                cuotaFija: 10000
                incluidoVozSeg: 60
                incluidoSms: 10
                incluidoMb: 100
                excedenteVozPorSeg: 3
                excedenteSmsPorMensaje: 100
                excedenteMbPorMb: 50
      responses:
        '201':
          description: Plan creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400':
          description: Cuerpo mal formado (`SOLICITUD_INVALIDA`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Ya existe un plan con ese nombre (`PLAN_DUPLICADO`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Tipo de estrategia desconocido o parámetros inválidos (`TIPO_ESTRATEGIA_DESCONOCIDO`, `PARAMETROS_INVALIDOS`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /suscriptores:
    get:
      tags: [Suscriptores]
      summary: Lista los suscriptores con su plan
      responses:
        '200':
          description: Suscriptores
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Suscriptor' } }

  /suscriptores/{msisdn}:
    put:
      tags: [Suscriptores]
      summary: Crea un suscriptor o le cambia el plan (idempotente)
      parameters:
        - { name: msisdn, in: path, required: true, schema: { type: string, pattern: '^\d{10}$' }, description: Número de línea (10 dígitos) }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoSuscriptor' }
            example: { nombre: Cliente Roaming, plan: Plan-Roaming }
      responses:
        '200':
          description: Suscriptor guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suscriptor' }
        '400':
          description: Número o cuerpo inválido (`SOLICITUD_INVALIDA`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: El plan indicado no existe (`PLAN_NO_ENCONTRADO`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo: { type: string, example: LOTE_DUPLICADO }
            mensaje: { type: string }
            detalles: { type: array, items: { type: string } }
    Salud:
      type: object
      required: [estado, servicio, hora]
      properties:
        estado: { type: string, example: ok }
        servicio: { type: string, example: telcocore-mvno }
        hora: { type: string, format: date-time }
    ResultadoIngesta:
      type: object
      required: [loteId, estado, total, aceptados, rechazados]
      properties:
        loteId: { type: integer }
        estado: { type: string, enum: [PROCESADO, PROCESADO_CON_RECHAZOS] }
        total: { type: integer, description: Filas del archivo }
        aceptados: { type: integer, description: CDR tarificados y guardados }
        rechazados: { type: integer, description: Filas en cuarentena }
    Lote:
      type: object
      required: [id, nombreArchivo, formato, estado, total, aceptados, rechazados, creadoEn]
      properties:
        id: { type: integer }
        nombreArchivo: { type: string }
        formato: { type: string, enum: [csv, json] }
        estado: { type: string, enum: [PROCESADO, PROCESADO_CON_RECHAZOS, FALLIDO] }
        total: { type: integer }
        aceptados: { type: integer }
        rechazados: { type: integer }
        creadoEn: { type: string, format: date-time }
    Rechazo:
      type: object
      required: [numeroFila, idExterno, causa, detalle, crudo]
      properties:
        numeroFila: { type: integer, description: 'Posición del registro en el archivo (1 = primero, sin contar el encabezado)' }
        idExterno: { type: string, nullable: true }
        causa: { type: string, enum: [CDR_INVALIDO, PLAN_NO_EXISTE, TARIFA_NO_APLICABLE] }
        detalle: { type: string }
        crudo: { type: string, description: Registro original tal como llegó }
    PaginaRechazos:
      type: object
      required: [lote, total, page, size, items]
      properties:
        lote: { $ref: '#/components/schemas/Lote' }
        total: { type: integer, description: Rechazos del lote en total }
        page: { type: integer }
        size: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/Rechazo' } }
    LineaFactura:
      type: object
      required: [concepto, cantidad, unidad, monto]
      properties:
        concepto: { type: string, example: Voz excedente }
        cantidad: { type: string, pattern: '^-?\d+(\.\d+)?$', description: 'Segundos, mensajes o MB' }
        unidad: { type: string, enum: [SEG, SMS, MB] }
        monto: { type: string, pattern: '^-?\d+$', description: Pesos colombianos }
    Factura:
      type: object
      required: [suscriptor, periodo, plan, cuotaFija, totalVariable, total, lineas]
      properties:
        suscriptor: { type: string }
        periodo: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        plan: { type: string }
        cuotaFija: { type: string, pattern: '^\d+$' }
        totalVariable: { type: string, pattern: '^\d+$' }
        total: { type: string, pattern: '^\d+$' }
        lineas: { type: array, items: { $ref: '#/components/schemas/LineaFactura' } }
    Plan:
      type: object
      required: [id, nombre, tipoEstrategia, parametros, activo]
      properties:
        id: { type: integer }
        nombre: { type: string }
        tipoEstrategia: { type: string, example: POSTPAGO_MIX }
        parametros: { type: object, additionalProperties: true }
        activo: { type: boolean }
    NuevoPlan:
      type: object
      required: [nombre, tipoEstrategia, parametros]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 80 }
        tipoEstrategia: { type: string }
        parametros: { type: object, additionalProperties: true }
    Suscriptor:
      type: object
      required: [msisdn, nombre, plan]
      properties:
        msisdn: { type: string }
        nombre: { type: string }
        plan: { type: string, description: Nombre del plan }
    NuevoSuscriptor:
      type: object
      required: [nombre, plan]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 80 }
        plan: { type: string, description: Nombre de un plan existente }
